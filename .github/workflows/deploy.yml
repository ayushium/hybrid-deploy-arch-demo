name: deploy

on:
  push: { branches: [main] }        # main is the deploy branch — push here, it ships
  pull_request:                     # CI only, never deploys
  workflow_dispatch:                # "Run workflow" button — redeploy with no commit
    inputs:
      force:
        description: Deploy both halves regardless of what changed
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write      # required for AWS OIDC
  contents: read

jobs:
  # ---- which half of the monorepo actually changed? ------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/shared/**'
            web:
              - *shared
              - 'apps/web/**'
            api:
              - *shared
              - 'apps/api/**'

  # ---- one CI job for the whole repo --------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck     # a bad change to packages/shared fails HERE

  # ---- edge: ~30s, atomic, global -----------------------------------------
  deploy-web:
    needs: [changes, ci]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.web == 'true' || inputs.force)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@campuswall/web..." build

      # Deploy with the wrangler pinned in pnpm-lock.yaml, already installed by
      # the step above. cloudflare/wrangler-action would instead shell out to
      # `npm install wrangler` inside apps/web, and npm does not understand the
      # `workspace:*` protocol pnpm uses for @campuswall/shared — so it exits 1.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  # ---- origin: fan out across a fleet whose size keeps changing -----------
  deploy-api:
    needs: [changes, ci]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.api == 'true' || inputs.force)
    runs-on: ubuntu-latest
    env:
      ASG_NAME: campuswall-asg      # MUST match the ASG you create in the console
      AWS_REGION: ap-south-1
    steps:
      # TEMPORARY — remove once OIDC is working.
      # Prints the exact `sub` GitHub will send and sanity-checks the role ARN's
      # shape. The secret itself stays masked, so nothing leaks.
      - name: debug OIDC
        run: |
          echo "repository:   ${{ github.repository }}"
          echo "ref:          ${{ github.ref }}"
          # github.repository is name-only; the real sub uses the ID-based prefix
          # shown in Settings -> Actions -> OIDC.
          echo "sub suffix:   :ref:${{ github.ref }}  (prefix: Settings -> Actions -> OIDC)"
          ARN='${{ secrets.AWS_DEPLOY_ROLE_ARN }}'
          case "$ARN" in
            arn:aws:iam::*:role/*) echo "role arn shape: OK" ;;
            "")                    echo "role arn: EMPTY - secret not set on this repo" ;;
            *)                     echo "role arn shape: WRONG" ;;
          esac
          # Print the pieces, not the whole value: substrings aren't masked, and
          # neither an account id nor a role name is a credential.
          echo "account:   $(printf '%s' "$ARN" | cut -d: -f5)"
          echo "role name: ${ARN##*/}"
          echo "length:    ${#ARN}  (expect no trailing whitespace)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   # OIDC: no stored keys
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll the fleet via SSM
        run: |
          set -euo pipefail

          # Target by ASG tag, so this always hits the CURRENT set of instances.
          CMD=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --targets "Key=tag:aws:autoscaling:groupName,Values=$ASG_NAME" \
            --parameters commands='[
              "set -eux",
              "cd /opt/app",
              "git fetch --depth 1 origin main",
              "git reset --hard origin/main",
              "pnpm install --frozen-lockfile --filter @campuswall/api...",
              "pnpm --filter @campuswall/api... build",
              "systemctl restart campuswall"
            ]' \
            --query Command.CommandId --output text)

          echo "SSM command: $CMD"

          for i in $(seq 1 40); do
            sleep 5
            ST=$(aws ssm list-command-invocations --command-id "$CMD" \
                   --query 'CommandInvocations[].Status' --output text)

            # An empty invocation list means the tag filter matched nothing.
            # Fail loudly rather than spinning until the timeout: a deploy that
            # updates zero instances must never look like a slow success.
            if [ -z "$ST" ]; then
              echo "no invocations yet ($i/6)"
              if [ "$i" -ge 6 ]; then
                echo "::error::SSM matched 0 instances after 30s - nothing was deployed."
                echo "Check, in order:"
                echo "  1. Instances carry the campuswall-ec2-role instance profile"
                echo "     (attach it to the launch template, then replace the instances)"
                echo "  2. They appear under Systems Manager > Fleet Manager"
                echo "  3. ASG_NAME ($ASG_NAME) matches the Auto Scaling group exactly"
                exit 1
              fi
              continue
            fi

            echo "status: $ST"
            case "$ST" in
              *Failed*|*TimedOut*|*Cancelled*) echo "::error::deploy failed"; exit 1 ;;
            esac
            if ! echo "$ST" | grep -qE 'Pending|InProgress|Delayed'; then
              echo "fleet updated"; exit 0
            fi
          done
          echo "::error::timed out waiting for SSM"; exit 1
